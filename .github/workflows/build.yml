name: Build firmware

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

# Cancel a superseded run (new push / re-run on the same ref) instead of
# leaving it queued for a scarce runner — those stale in-progress jobs would
# otherwise linger ~15 min and surface as spurious "cancelled/failed" checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: arm-none-eabi-gcc 14.3 / STM32H733XG (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The build finishes in ~1 min once a runner is assigned; bound the job so a
    # runner-scarcity stall fails fast instead of hanging ~15 min.
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install arm-none-eabi-gcc 14.3
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.3.Rel1'

      - name: Show toolchain version
        run: arm-none-eabi-gcc --version

      - name: Build (make -j)
        # getconf _NPROCESSORS_ONLN is POSIX (works on Linux + macOS, unlike nproc)
        run: make -j$(getconf _NPROCESSORS_ONLN)

      - name: Verify firmware artifacts exist
        run: |
          test -f build/binaries/uDV.elf
          test -f build/binaries/uDV.bin
          test -f build/binaries/uDV.hex

      - name: Print firmware size
        run: arm-none-eabi-size build/binaries/uDV.elf

      - name: Upload firmware artifacts
        # Only upload from the Linux runner to avoid artifact name collisions
        # and because the elf/bin/hex are byte-identical across host OSes.
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: uDV-firmware
          path: |
            build/binaries/uDV.elf
            build/binaries/uDV.bin
            build/binaries/uDV.hex
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Parallel CMake build — catches CMakeLists.txt vs Makefile drift.
  # Same toolchain + matrix as the Makefile job, but invoked via the
  # 'Configure preset using toolchain file' preset in CMakePresets.json.
  # Job names are kept distinct from the Makefile job so the existing
  # required-status-check rule on dev (which references the Makefile-job
  # names verbatim) keeps working without a branch-protection update.
  # Promote these to required checks later by editing dev's protection.
  # ---------------------------------------------------------------------------
  build-cmake:
    name: arm-none-eabi-gcc 14.3 / STM32H733XG / CMake (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install arm-none-eabi-gcc 14.3
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.3.Rel1'

      - name: Show toolchain version
        run: arm-none-eabi-gcc --version

      - name: Configure (CMake preset)
        run: cmake --preset 'Configure preset using toolchain file'

      - name: Build (cmake --build -j)
        run: cmake --build build/binaries -j $(getconf _NPROCESSORS_ONLN)

      - name: Verify firmware artifacts exist
        run: |
          test -f build/binaries/uDV.elf
          test -f build/binaries/uDV.bin
          test -f build/binaries/uDV.hex

      - name: Print firmware size
        run: arm-none-eabi-size build/binaries/uDV.elf
